name: chiffra

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chiffra
      POSTGRES_USER: chiffra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/001_sources.sql:/docker-entrypoint-initdb.d/001_sources.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - internal

networks:
  internal:

volumes:
  postgres_data:
  redis_data:
